name: ci

on:
  pull_request:
    branches:
      - trunk

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: mlugg/setup-zig@v2
    - name: Check zig is canonical
      shell: bash
      run: |
        zig fmt --check .
  build:
    strategy:
      matrix:
        repo:
          - glfw
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: "${{ github.repository_owner }}/${{ matrix.repo }}.zig"

    - name: Setup Zig
      uses: mlugg/setup-zig@v2

    - name: Prepare ${{ matrix.repo }}.zig/build.zig.zon
      env:
        URL: "git+${{ github.server_url }}/${{ github.repository }}#${{ github.event.pull_request.head.sha }}"
      shell: 'bash'
      run: |
        zig fetch --save "${URL}"

    - name: Test updating ${{ matrix.repo }}.zig
      env:
        REPO: "${{ matrix.repo }}"
        RUNNER_TMP: "${{ runner.temp }}"
      shell: 'bash'
      run: |
        zig build -Dupdate -Dverbose

    - name: Test fetching ${{ matrix.repo }}.zig
      env:
        REPO: "${{ matrix.repo }}"
        RUNNER_TMP: "${{ runner.temp }}"
        PR_BODY: "${{ github.event.pull_request.body }}"
      shell: 'bash'
      run: |
        opts="$(printf '%s' "${PR_BODY}" | sed -n "s/^\[${REPO} fetch opts\] \(.*\)/\1/p")"
        opts="${opts#"${opts%%[![:space:]]*}"}"
        opts="${opts%"${opts##*[![:space:]]}"}"
        set -f
        zig build -Dfetch -Dverbose ${opts}
        set +f
