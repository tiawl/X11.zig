name: ci

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  pull_request:
    branches:
      - stable

jobs:
  linter:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"
      - id: lastcommit
        shell: 'bash'
        run: |
          set -x
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 'master'
          use-cache: false
      - name: Check zig is canonical
        shell: 'bash'
        run: |
          rm -rf .zig-* zig-* ~/.cache/zig
          zig fmt --check .

  maintainance:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"
      - id: lastcommit
        shell: 'bash'
        run: |
          set -x
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 'master'
          use-cache: false

      - name: Test updating
        shell: 'bash'
        run: |
          rm -rf .zig-* zig-* ~/.cache/zig
          zig build -Dupdate -Dverbose -freference-trace --verbose

  user:
    strategy:
      matrix:
        repo:
          - glfw
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "${{ github.repository_owner }}/${{ matrix.repo }}.zig"
          ref: "${{ github.event.pull_request.base.ref }}"

      - id: lastcommit
        shell: 'bash'
        run: |
          set -x
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 'master'
          use-cache: false

      - name: Prepare ${{ matrix.repo }}.zig/build.zig.zon
        env:
          URL: "git+${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name }}#${{ github.event.pull_request.head.sha }}"
        shell: 'bash'
        run: |
          rm -rf .zig-* zig-* ~/.cache/zig
          zig fetch --save "${URL}"

      - name: Test building ${{ matrix.repo }}.zig
        shell: 'bash'
        run: |
          rm -rf .zig-* zig-* ~/.cache/zig
          zig build -Dverbose -freference-trace --verbose
