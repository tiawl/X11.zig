name: ci

on:
  pull_request:
    branches:
      - zig-stable
      - zig-nightly

jobs:
  linter:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.ref }}"
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: "${{ github.event.pull_request.base.ref == 'zig-stable' && 'latest' || 'master' }}"
    - name: Check zig is canonical
      shell: 'bash'
      run: zig fmt --check .

  maintainance:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.ref }}"
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: "${{ github.event.pull_request.base.ref == 'zig-stable' && 'latest' || 'master' }}"

    - name: Test updating
      shell: 'bash'
      run: zig build -Dupdate -Dverbose

  user:
    strategy:
      matrix:
        repo:
          - glfw
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        repository: "${{ github.repository_owner }}/${{ matrix.repo }}.zig"
        ref: "${{ github.event.pull_request.head.ref }}"

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: "${{ github.event.pull_request.base.ref == 'zig-stable' && 'latest' || 'master' }}"

    - name: Prepare ${{ matrix.repo }}.zig/build.zig.zon
      env:
        URL: "git+${{ github.server_url }}/${{ github.repository }}#${{ github.event.pull_request.head.sha }}"
      shell: 'bash'
      run: zig fetch --save "${URL}"

    - name: Test building ${{ matrix.repo }}.zig
      shell: 'bash'
      run: zig build -Dverbose
